name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tokens, contraste e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions fixadas por SHA (o comentário diz a versão) para o código não mudar por baixo de nós.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Sem dependências para instalar: tokens, contraste e testes usam só o Node.
      - name: Tokens em dia, contraste AA e testes
        run: npm run check

  secrets:
    name: Busca de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: segredo apagado num commit antigo também conta
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
